name: Cloudflare Worker

# Tests every change to the bot; deploys it to Cloudflare on every push to master.
on:
  push:
    branches: [master]
    paths: ['cloudflare-worker/**', '.github/workflows/cloudflare-worker.yml']
  pull_request:
    paths: ['cloudflare-worker/**', '.github/workflows/cloudflare-worker.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: cloudflare-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: cloudflare-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      ADMIN_CHAT_IDS: ${{ vars.ADMIN_CHAT_IDS }}
    steps:
      - name: Skip until secrets are configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.BOT_TOKEN == ''
        working-directory: .
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BOT_TOKEN repository secrets to enable deploys (see cloudflare-worker/README.md)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BOT_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BOT_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BOT_TOKEN != ''
      - run: npm run deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BOT_TOKEN != ''
