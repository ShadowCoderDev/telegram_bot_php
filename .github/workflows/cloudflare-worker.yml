name: Cloudflare Worker

# Tests every change to the bot; deploys it to Cloudflare on every push to master.
on:
  push:
    branches: [master]
    paths: ['cloudflare-worker/**', '.github/workflows/cloudflare-worker.yml']
  pull_request:
    paths: ['cloudflare-worker/**', '.github/workflows/cloudflare-worker.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: cloudflare-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # What each user action costs in D1, and that it stays flat with a lot of data (see CAPACITY.md).
      - name: Capacity report
        if: always()
        run: cat .wrangler/capacity-report.md .wrangler/capacity-scale.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # One job per seller. Each seller is a GitHub "environment" (Settings → Environments) holding that
  # seller's CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BOT_TOKEN, WEBHOOK_SECRET secrets and optional
  # ADMIN_CHAT_IDS / WORKER_NAME variables. List the environment names in the repository variable
  # SELLERS, e.g. ["ali-shop","sara-books"]. Without SELLERS, a single "production" environment is
  # used, which falls back to the repository-level secrets.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seller: ${{ fromJSON(vars.SELLERS || '["production"]') }}
    environment: ${{ matrix.seller }}
    concurrency: cloudflare-deploy-${{ matrix.seller }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      ADMIN_CHAT_IDS: ${{ vars.ADMIN_CHAT_IDS }}
      PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      PLATFORM_ADMIN_IDS: ${{ vars.PLATFORM_ADMIN_IDS }}
      HAS_BOT: ${{ secrets.BOT_TOKEN != '' || secrets.PLATFORM_BOT_TOKEN != '' }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
    steps:
      - name: Skip until secrets are configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.HAS_BOT != 'true'
        working-directory: .
        run: |
          echo "::notice::${{ matrix.seller }} - add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and PLATFORM_BOT_TOKEN + MASTER_KEY (and/or BOT_TOKEN) secrets to enable deploys (see cloudflare-worker/README.md)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.HAS_BOT == 'true'
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.HAS_BOT == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != '' && env.HAS_BOT == 'true'
      - run: npm run deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.HAS_BOT == 'true'
